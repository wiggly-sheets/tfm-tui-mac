name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# One run per ref: a new push to the same branch/PR cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Installer syntax
        run: bash -n install.sh source.sh

      - name: Build
        run: make build

      # The lint, the format check, the strict typecheck, the test suite and
      # the smoke test of the compiled binary. `make test` compiles the
      # binary first, so the smoke test has one to run.
      - name: Check + test
        run: make test

      # The four release slices, each checked against its exact architecture,
      # so a broken cross-compile fails here instead of at release time. The
      # Linux slices are read, never executed, by `make verify`.
      - name: macOS + Linux slices
        run: make build-arm build-intel build-linux-arm build-linux-intel

      - name: Verify the slices
        run: make verify

      # The one native run: the Linux x64 artifact must answer --version on
      # the platform it targets.
      - name: Smoke the Linux x64 binary
        if: matrix.os == 'ubuntu-latest'
        run: test "$(./dist/tfm-x86_64-linux --version)" = "tfm $(bun -e 'console.log(require("./package.json").version)')"
