name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# One run per ref: a new push to the same branch/PR cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (lint + format + strict typecheck)
        run: bun run check

      - name: Installer syntax
        run: bash -n install.sh source.sh

      - name: Test
        run: bun run test

      - name: Compile smoke test
        run: bun run compile

      # --version must answer without loading the app graph (see the lazy
      # imports in src/index.ts), print exactly "tfm <package.json version>"
      # and exit 0. A hang would block the step, so the 20s spawn timeout
      # fails it instead. The interactive TUI is not smoke-tested here: a
      # runner has no tty. Steps get the generous job default (360 min), so
      # no per-step timeout is needed.
      - name: Compiled binary reports the package version
        run: |
          expected="tfm $(bun -e 'console.log(require("./package.json").version)')"
          actual=$(bun -e 'const p = Bun.spawnSync(["./dist/tfm", "--version"], { timeout: 20000 }); process.stdout.write(p.stdout.toString()); process.exit(p.exitCode)')
          echo "expected: $expected"
          echo "actual:   $actual"
          test "$actual" = "$expected"
