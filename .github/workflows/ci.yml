name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# One run per ref: a new push to the same branch/PR cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Installer syntax
        run: bash -n install.sh source.sh

      - name: Build
        run: make build

      # The lint, the format check, the strict typecheck, the test suite and
      # the smoke test of the compiled binary. `make test` compiles the
      # binary first, so the smoke test has one to run.
      - name: Check + test
        run: make test
