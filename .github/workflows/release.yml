name: Release

# Produces the artifacts install.sh downloads: tfm-{x86_64,aarch64}-linux.gz
# and tfm-{aarch64,x86_64}-macos.gz, plus a .sha256 sidecar each, AND the
# bundled video-thumbnail ffmpeg as tfm-ffmpeg-{x86_64,aarch64}-linux.gz plus
# tfm-ffmpeg-{aarch64,x86_64}-macos.gz, each with its own .sha256 (install.sh
# verifies when present and warns-but-continues when absent). macOS also ships
# a lipo'd universal tfm-universal-macos.gz and ffmpeg sidecar. Tag a version
# to ship it:
#   git tag v1.0.0 && git push origin v1.0.0
# Version must match package.json (checked below) so --version never lies.
# Linux covers x64 + arm64; macOS covers both plus the universal binary.

on:
  push:
    tags: ["v*"]

# Tag pushes queue rather than cancel: a release publishes artifacts, and
# killing one mid-flight can leave a release half-uploaded. Re-pushing the
# same tag runs the newer build instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the `release` job below opts into contents: write
# to publish the release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            arch: x86_64-linux
            ffmpeg_asset: ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            arch: aarch64-linux
            ffmpeg_asset: ffmpeg-n9.0-latest-linuxarm64-gpl-9.0.tar.xz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Version matches package.json
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "${{ github.ref_name }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check + test
        run: |
          bun run check
          bun run test

      - name: Compile
        run: bun build --compile --target=${{ matrix.target }} src/index.ts assets/icons/*.svg --outfile dist/tfm-${{ matrix.arch }}

      - name: Package + checksum
        run: |
          gzip -kf dist/tfm-${{ matrix.arch }}
          (cd dist && sha256sum tfm-${{ matrix.arch }}.gz > tfm-${{ matrix.arch }}.gz.sha256)

      # Sidecar source: BtbN versioned static builds, pinned to the n9.0
      # series below (bumping series = changing these two matrix lines).
      # The `latest` tag rolls monthly rebuilds, but our published .sha256
      # freezes whatever bytes the release actually built — auditable per
      # release. Upstream checksums are verified before we trust the bytes.
      # (dev/CI runs use ffmpeg-static's older binary instead; same thumb
      # argv, and the thumb disk cache is per-machine local so the skew
      # never cross-serves.)
      - name: Package ffmpeg sidecar
        run: |
          curl -fsSL --retry 3 -o ffmpeg-sidecar.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.ffmpeg_asset }}"
          curl -fsSL --retry 3 -o ffmpeg-checksums.sha256 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256"
          awk -v f="${{ matrix.ffmpeg_asset }}" '$2==f {print $1 "  ffmpeg-sidecar.tar.xz"}' ffmpeg-checksums.sha256 | sha256sum -c -
          mkdir -p ffmpeg-sidecar && tar -xJf ffmpeg-sidecar.tar.xz -C ffmpeg-sidecar --wildcards "*/bin/ffmpeg"
          cp ffmpeg-sidecar/*/bin/ffmpeg dist/tfm-ffmpeg-${{ matrix.arch }}
          dist/tfm-ffmpeg-${{ matrix.arch }} -hide_banner -version
          gzip -kf dist/tfm-ffmpeg-${{ matrix.arch }}
          (cd dist && sha256sum tfm-ffmpeg-${{ matrix.arch }}.gz > tfm-ffmpeg-${{ matrix.arch }}.gz.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfm-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/tfm-${{ matrix.arch }}.gz
            dist/tfm-${{ matrix.arch }}.gz.sha256
            dist/tfm-ffmpeg-${{ matrix.arch }}.gz
            dist/tfm-ffmpeg-${{ matrix.arch }}.gz.sha256

  # macOS arm64 runner (Apple Silicon), cross-compiling the x64 slice and
  # lipo-ing the two into a universal binary. The ffmpeg sidecars ride
  # ffmpeg-static's pinned darwin binaries — the same binaries dev/CI runs
  # use (see the BtbN comment above) — instead of a brew install (brew ffmpeg
  # links Homebrew dylibs and would not run on machines without them).
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Version matches package.json
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "${{ github.ref_name }}"

      # --os=* --cpu=*: cross-compiling darwin-x64 from this arm64 host needs
      # @opentui/core-darwin-x64, which a plain install skips (host-arch only).
      - name: Install dependencies
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      - name: Check + test
        run: |
          bun run check
          bun run test

      - name: Compile (arm64 + x64 + universal)
        run: bun run scripts/build.ts mac-arm64 mac-x64 mac-universal

      - name: Package + checksum
        run: |
          for a in aarch64-macos x86_64-macos universal-macos; do
            gzip -kf dist/tfm-$a
            (cd dist && shasum -a 256 tfm-$a.gz > tfm-$a.gz.sha256)
          done

      # the x64 ffmpeg sidecar smoke test below runs the x86_64 binary under
      # Rosetta; the command is idempotent (no-ops when Rosetta is present)
      - name: Ensure Rosetta 2 (for the x64 sidecar smoke test)
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Package ffmpeg sidecar
        run: |
          # ffmpeg-static installs only the HOST arch, but its pinned release
          # also publishes ffmpeg-darwin-x64.gz, so the x64 sidecar comes from
          # the same tag and the universal sidecar lipos the two.
          test -x node_modules/ffmpeg-static/ffmpeg
          cp node_modules/ffmpeg-static/ffmpeg dist/tfm-ffmpeg-aarch64-macos
          TAG=$(bun -e 'console.log(require("ffmpeg-static/package.json")["ffmpeg-static"]["binary-release-tag"])')
          curl -fsSL --retry 3 -o ffmpeg-darwin-x64.gz "https://github.com/eugeneware/ffmpeg-static/releases/download/$TAG/ffmpeg-darwin-x64.gz"
          gunzip -f ffmpeg-darwin-x64.gz
          chmod +x ffmpeg-darwin-x64
          mv ffmpeg-darwin-x64 dist/tfm-ffmpeg-x86_64-macos
          lipo -create -output dist/tfm-ffmpeg-universal-macos dist/tfm-ffmpeg-aarch64-macos dist/tfm-ffmpeg-x86_64-macos
          # ffmpeg-static ships the arm64 binary signed but the x64 one unsigned,
          # and lipo invalidates the fat container's signature: ad-hoc sign both
          # so codesign --verify passes and Apple Silicon will run them.
          codesign --force --sign - dist/tfm-ffmpeg-x86_64-macos
          codesign --force --sign - dist/tfm-ffmpeg-universal-macos
          for a in aarch64-macos x86_64-macos universal-macos; do
            dist/tfm-ffmpeg-$a -hide_banner -version >/dev/null
            gzip -kf dist/tfm-ffmpeg-$a
            (cd dist && shasum -a 256 tfm-ffmpeg-$a.gz > tfm-ffmpeg-$a.gz.sha256)
          done

      - name: Verify code signature
        run: |
          for a in aarch64-macos x86_64-macos universal-macos; do
            codesign --verify --deep --strict --verbose=2 dist/tfm-$a
            codesign --verify --deep --strict --verbose=2 dist/tfm-ffmpeg-$a
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfm-macos
          retention-days: 7
          path: |
            dist/tfm-aarch64-macos.gz
            dist/tfm-aarch64-macos.gz.sha256
            dist/tfm-x86_64-macos.gz
            dist/tfm-x86_64-macos.gz.sha256
            dist/tfm-universal-macos.gz
            dist/tfm-universal-macos.gz.sha256
            dist/tfm-ffmpeg-aarch64-macos.gz
            dist/tfm-ffmpeg-aarch64-macos.gz.sha256
            dist/tfm-ffmpeg-x86_64-macos.gz
            dist/tfm-ffmpeg-x86_64-macos.gz.sha256
            dist/tfm-ffmpeg-universal-macos.gz
            dist/tfm-ffmpeg-universal-macos.gz.sha256

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: (cd dist && sha256sum -c *.sha256)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tfm-x86_64-linux.gz
            dist/tfm-x86_64-linux.gz.sha256
            dist/tfm-aarch64-linux.gz
            dist/tfm-aarch64-linux.gz.sha256
            dist/tfm-aarch64-macos.gz
            dist/tfm-aarch64-macos.gz.sha256
            dist/tfm-x86_64-macos.gz
            dist/tfm-x86_64-macos.gz.sha256
            dist/tfm-universal-macos.gz
            dist/tfm-universal-macos.gz.sha256
            dist/tfm-ffmpeg-x86_64-linux.gz
            dist/tfm-ffmpeg-x86_64-linux.gz.sha256
            dist/tfm-ffmpeg-aarch64-linux.gz
            dist/tfm-ffmpeg-aarch64-linux.gz.sha256
            dist/tfm-ffmpeg-aarch64-macos.gz
            dist/tfm-ffmpeg-aarch64-macos.gz.sha256
            dist/tfm-ffmpeg-x86_64-macos.gz
            dist/tfm-ffmpeg-x86_64-macos.gz.sha256
            dist/tfm-ffmpeg-universal-macos.gz
            dist/tfm-ffmpeg-universal-macos.gz.sha256
